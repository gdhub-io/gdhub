version: '3.6'

services:
  prod:
    build:
      context: .
      target: runner
    container_name: gdhub-prod
    env_file:
      - .env
    expose:
      - '${PORT:-3000}'
    ports:
      - '${PORT:-3000}'
    restart: unless-stopped
    networks:
      - gdhub-network

networks:
  gdhub-network:
