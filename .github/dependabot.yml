version: 2

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    # No target-branch on purpose: pointing it at a non-default branch turns off
    # security updates for the ecosystem, and those are the ones that matter.
    ignore:
      # The two-repo schema loop in CLAUDE.md is deliberate: a new gdhub-prisma is
      # adopted with a db:generate and a look at what changed, not merged for us.
      # This is also why no `registries` entry is declared — with the private
      # registry listed, Dependabot treated it as the base and rewrote 140 public
      # packages in bun.lock to npm.pkg.github.com, which then 403s in CI.
      - dependency-name: '@gdhub-io/*'
