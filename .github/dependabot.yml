version: 2

# @gdhub-io/* are published to GitHub Packages, which Dependabot cannot read
# without credentials. PACKAGES_TOKEN is a Dependabot secret (repository
# Settings -> Secrets -> Dependabot), separate from the Actions secret.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.PACKAGES_TOKEN}}

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    registries:
      - github-packages
    schedule:
      interval: 'weekly'
    # Updates land in dev and reach production only through the usual dev -> main
    # promotion. Targeting the default branch would put them straight into a
    # Vercel production deploy.
    target-branch: 'dev'
    ignore:
      # The two-repo schema loop in CLAUDE.md is deliberate: a new gdhub-prisma
      # is adopted with a db:generate and a look at what changed, not merged for us.
      - dependency-name: '@gdhub-io/*'
