name: New Members Send Message
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: New Members Send Message
        run: |
          curl --request POST \
          --url 'https://gdhub.io/api/cron/new-members' \
          --header 'Authorization: ${{ secrets.BACKEND_KEY }}'
