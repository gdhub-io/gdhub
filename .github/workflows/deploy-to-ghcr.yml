name: Deploy to GHCR

on:
  workflow_dispatch:

env:
  # APP
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  BACKEND_KEY: ${{ secrets.BACKEND_KEY }}
  NEXT_PUBLIC_APP_URI: ${{ secrets.NEXT_PUBLIC_APP_URI }}
  NEXT_PUBLIC_AUTH_COOKIE_NAME: ${{ secrets.NEXT_PUBLIC_AUTH_COOKIE_NAME }}
  # AIRTABLE
  AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
  AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
  # GOOGLE OAUTH
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLEINT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLEINT_SECRET }}
  # NOTION
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_DATABASE_DOCS: ${{ secrets.NOTION_DATABASE_DOCS }}
  # TELEGRAM
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_DISABLE_NOTIFICATIONS: ${{ secrets.TELEGRAM_DISABLE_NOTIFICATIONS }}
  TELEGRAM_TOPIC_NEWS: ${{ secrets.TELEGRAM_TOPIC_NEWS }}
  TELEGRAM_TOPIC_VACANCIES: ${{ secrets.TELEGRAM_TOPIC_VACANCIES }}
  TELEGRAM_TOPIC_REPORTS: ${{ secrets.TELEGRAM_TOPIC_REPORTS }}
  # SANITY
  SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
  SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
  SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
  # DAILY
  DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
  # NOVU
  NOVU_API_SECRET: ${{ secrets.NOVU_API_SECRET }}
  NOVU_CLIENT_APP_ID: ${{ secrets.NOVU_CLIENT_APP_ID }}
  NEXT_PUBLIC_NOVU_CLIENT_APP_ID: ${{ secrets.NEXT_PUBLIC_NOVU_CLIENT_APP_ID }}
  # MAILGUN
  MAILGUN_API_KEY:  ${{ secrets.MAILGUN_API_KEY }}
  # TYPESENSE
  TYPESENSE_ADMIN_API:  ${{ secrets.TYPESENSE_ADMIN_API }}
  NEXT_PUBLIC_TYPESENSE_SEARCH_API:  ${{ secrets.NEXT_PUBLIC_TYPESENSE_SEARCH_API }}
  NEXT_PUBLIC_TYPESENSE_HOST:  ${{ secrets.NEXT_PUBLIC_TYPESENSE_HOST }}
  NEXT_PUBLIC_TYPESENSE_PORT:  ${{ secrets.NEXT_PUBLIC_TYPESENSE_PORT }}
  NEXT_PUBLIC_TYPESENSE_PROTOCOL:  ${{ secrets.NEXT_PUBLIC_TYPESENSE_PROTOCOL }}

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'Build image'
        run: docker compose -f docker-compose.prod.yml build
      
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GH_TOKEN}}

      - name: Push image to Container Registry
        run: docker compose -f docker-compose.prod.yml push
