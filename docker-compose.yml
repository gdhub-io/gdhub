version: '3.6'

services:
  dev:
    build: 
      context: .
      target: deps
    container_name: gamelab-dev
    env_file:
      - .env
    ports:
      - 3000:3000
      - 9229:9229
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - gamelab-network
    command: yarn dev

  searchengine:
    container_name: gamelab-searchengine
    image: typesense/typesense:0.24.1
    restart: on-failure
    ports:
      - "8108:8108"
    volumes:
      - gamelab-typesense-data:/data
    command: '--data-dir /data --api-key=xyz --enable-cors'
    networks: 
      - gamelab-network

volumes:
  gamelab-typesense-data:

networks:
  gamelab-network:
  