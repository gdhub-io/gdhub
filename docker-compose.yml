version: '3.6'

services:
  dev:
    build: 
      context: .
      target: deps
    container_name: gamelab-dev
    env_file:
      - .env
    ports:
      - 3000:3000
      - 9229:9229
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - gamelab-network
    command: yarn dev

networks:
  gamelab-network:
    name: gamelab-network