services:
  dev:
    build:
      context: .
      target: deps
    container_name: gdhub_dev
    env_file:
      - .env.docker
    ports:
      - 3000:3000
      - 9229:9229
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - gdhub_network
    command: yarn dev

  searchengine: #dashboard https://bfritscher.github.io
    container_name: gdhub_searchengine
    image: typesense/typesense:0.24.1
    restart: on-failure
    ports:
      - '8108:8108'
    volumes:
      - gdhub_typesense_data:/data
    command: '--data-dir /data --api-key=${TYPESENSE_ADMIN_API} --enable-cors'
    networks:
      - gdhub_network

  searchengine-dashboard: #dashboard https://bfritscher.github.io
    container_name: gdhub_typesense_dashboard
    image: ghcr.io/bfritscher/typesense-dashboard:latest
    restart: on-failure
    ports:
      - '8118:80'

  db:
    build: ./docker/postgres
    container_name: gdhub_db
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - gdhub_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init-app.sql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - gdhub_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  translation-app:
    image: tolgee/tolgee
    volumes:
      - gdhub_tolgee_data:/data
    ports:
      - '25432:25432' # if you would like to access the DB
      - '8080:8080'
    env_file:
      - .env.docker

  redis:
    image: bitnami/redis:latest
    container_name: gdhub_redis
    environment:
      - REDIS_PASSWORD=password12345
    ports:
      - '6379:6379'
    volumes:
      - gdhub_redis_data:/bitnami/redis/data
    networks:
      - gdhub_network

  broker:
    image: registry.gdhub.io/bullboard:latest
    container_name: gdhub_broker
    env_file:
      - .env.docker
    environment:
      - APP_USERNAME=admin
      - APP_PASSWORD=admin
      - REDIS_URL=redis://default:password12345@redis:6379
      - QUEUES_LIST=telegram,matching
      - APP_MAIN=${BROKER_APP_MAIN}
      - APP_EXPERTS=${BROKER_APP_EXPERTS}
    ports:
      - '3003:3000'
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - gdhub_network

volumes:
  gdhub_typesense_data:
  gdhub_postgres_data:
  gdhub_tolgee_data:
  gdhub_redis_data:

networks:
  gdhub_network:
