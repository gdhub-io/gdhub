version: '3.6'

services:
  dev:
    build:
      context: .
      target: deps
    container_name: gamelab-dev
    env_file:
      - .env
    ports:
      - 3000:3000
      - 9229:9229
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - gdhub-network
    command: yarn dev

  searchengine: #dashboard https://bfritscher.github.io
    container_name: gamelab-searchengine
    image: typesense/typesense:0.24.1
    restart: on-failure
    ports:
      - '8108:8108'
    volumes:
      - gamelab-typesense-data:/data
    command: '--data-dir /data --api-key=${TYPESENSE_ADMIN_API} --enable-cors'
    networks:
      - gdhub-network

  searchengine-dashboard: #dashboard https://bfritscher.github.io
    container_name: gamelab-typesense-dashboard
    image: ghcr.io/bfritscher/typesense-dashboard:latest
    restart: on-failure
    ports:
      - '8118:80'

  db:
    build: ./docker/postgres
    container_name: gamelab_db
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - gamelab-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init-app.sql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - gdhub-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  translation-app:
    image: tolgee/tolgee
    volumes:
      - gamelab-tolgee-data:/data
    ports:
      - '25432:25432' # if you would like to access the DB
      - '8080:8080'
    env_file:
      - .env

  redis:
    image: bitnami/redis:latest
    environment:
      - REDIS_PASSWORD=password12345
    ports:
      - '6379:6379'
    volumes:
      - gdhub-redis-data:/bitnami/redis/data
    networks:
      - gdhub-network

  bullboard:
    image: registry.gdhub.io/bullboard:latest
    container_name: gdhub_bullboard
    env_file: .env
    environment:
      - APP_USERNAME=admin
      - APP_PASSWORD=admin
      - REDIS_URL=redis://default:password12345@redis/0
      - QUEUES_LIST=telegram,matching
      - GDHUB_URL=${NEXTAUTH_URL}
      - GDHUB_BACKEND_KEY={BACKEND_KEY}
    ports:
      - '3003:3000'
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - gdhub-network

volumes:
  gamelab-typesense-data:
  gamelab-postgres-data:
  gamelab-tolgee-data:
  gdhub-redis-data:

networks:
  gdhub-network:
